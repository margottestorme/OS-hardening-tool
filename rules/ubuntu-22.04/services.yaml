# =============================================================================
# Règles CIS — services et paquets indésirables (section 2.1.x / 2.2.x)
# Benchmark : CIS Ubuntu Linux 22.04 LTS v3.0.0 — profil Server
# =============================================================================
# VÉRIFIÉ contre le PDF officiel. Toutes ces règles sont Level 1 - Server.
# Corrections de numérotation v3.0.0 :
#   avahi 2.1.2 (et non 2.1.1) · print server/CUPS 2.1.11 (et non 2.1.2)
#   NFS 2.1.9 (et non 2.1.7) · rpcbind 2.1.12 (et non 2.1.8)
#   rsync 2.1.13 (et non 2.1.9) · telnet client 2.2.4 (et non 2.3.4)
# En v3.0.0 les services serveur sont libellés "services are not in use" :
# un paquet non installé satisfait la règle, d'où l'audit par state:absent.
# =============================================================================

rules:
  - id: svc_avahi
    cis_id: "2.1.2"
    title: "Ensure avahi daemon services are not in use"
    level: 1
    profile: server
    category: services
    type: service
    params:
      package: avahi-daemon
      state: absent

  - id: svc_dhcp
    cis_id: "2.1.3"
    title: "Ensure dhcp server services are not in use"
    level: 1
    profile: server
    category: services
    type: service
    params:
      package: isc-dhcp-server
      state: absent

  - id: svc_nfs
    cis_id: "2.1.9"
    title: "Ensure network file system services are not in use"
    level: 1
    profile: server
    category: services
    type: service
    params:
      package: nfs-kernel-server
      state: absent

  - id: svc_cups
    cis_id: "2.1.11"
    title: "Ensure print server services are not in use"
    level: 1
    profile: server
    category: services
    type: service
    params:
      package: cups
      state: absent

  - id: svc_rpcbind
    cis_id: "2.1.12"
    title: "Ensure rpcbind services are not in use"
    level: 1
    profile: server
    category: services
    type: service
    params:
      package: rpcbind
      state: absent

  - id: svc_rsync
    cis_id: "2.1.13"
    title: "Ensure rsync services are not in use"
    level: 1
    profile: server
    category: services
    type: service
    params:
      package: rsync
      state: absent

  # --- Client indésirable (section 2.2.x) ---------------------------------
  - id: svc_telnet_client
    cis_id: "2.2.4"
    title: "Ensure telnet client is not installed"
    level: 1
    profile: server
    category: services
    type: service
    params:
      package: telnet
      state: absent
