# =============================================================================
# Règles CIS — catégorie réseau (section 3.3.x : paramètres noyau sysctl)
# Benchmark : CIS Ubuntu Linux 22.04 LTS v3.0.0 — Level 1, profil Server
# =============================================================================
# Chaque règle vérifie qu'une clé sysctl a la valeur attendue (comparaison eq).
#
# ⚠️  Les numéros 3.3.x et les valeurs attendues doivent être confirmés dans le
#     PDF officiel — il fait foi. Certaines recommandations CIS portent en plus
#     sur la variante `.default.` de la clé (ex. conf.default.send_redirects) :
#     ce sont des règles composées à ajouter plus tard, une clé par règle ici.
# =============================================================================

defaults:
  persist_file: /etc/sysctl.d/60-cis-hardening.conf

rules:
  - id: net_ipv4_ip_forward
    cis_id: "3.3.1"
    title: "Ensure IP forwarding is disabled"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.ip_forward
      expected: 0

  - id: net_ipv4_send_redirects
    cis_id: "3.3.2"
    title: "Ensure packet redirect sending is disabled"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.conf.all.send_redirects
      expected: 0

  - id: net_ipv4_accept_source_route
    cis_id: "3.3.3"
    title: "Ensure source routed packets are not accepted"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.conf.all.accept_source_route
      expected: 0

  - id: net_ipv4_accept_redirects
    cis_id: "3.3.4"
    title: "Ensure ICMP redirects are not accepted"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.conf.all.accept_redirects
      expected: 0

  - id: net_ipv4_secure_redirects
    cis_id: "3.3.5"
    title: "Ensure secure ICMP redirects are not accepted"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.conf.all.secure_redirects
      expected: 0

  - id: net_ipv4_icmp_ignore_broadcasts
    cis_id: "3.3.6"
    title: "Ensure broadcast ICMP requests are ignored"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.icmp_echo_ignore_broadcasts
      expected: 1

  - id: net_ipv4_rp_filter
    cis_id: "3.3.7"
    title: "Ensure reverse path filtering is enabled"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.conf.all.rp_filter
      expected: 1

  - id: net_ipv4_tcp_syncookies
    cis_id: "3.3.9"
    title: "Ensure TCP SYN cookies is enabled"
    level: 1
    profile: server
    category: network
    type: sysctl
    params:
      key: net.ipv4.tcp_syncookies
      expected: 1