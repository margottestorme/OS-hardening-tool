# =============================================================================
# Règles CIS — modules noyau filesystem (section 1.1.1.x)
# Benchmark : CIS Ubuntu Linux 22.04 LTS v3.0.0 — Level 1, profil Server
# =============================================================================
# Chaque règle vérifie qu'un module filesystem n'est ni chargé ni chargeable.
#
# ⚠️  Numéros 1.1.1.x à confirmer dans le PDF. Deux modules à manier avec soin,
#     à NE PAS remédier à l'aveugle au jalon 5 :
#       - squashfs : utilisé par snapd → le désactiver casse les snaps (exclu ici) ;
#       - usb-storage : le bloquer empêche les clés/disques USB de monter.
# =============================================================================

rules:
  - id: mod_cramfs
    cis_id: "1.1.1.1"
    title: "Ensure cramfs kernel module is not available"
    level: 1
    profile: server
    category: filesystem
    type: kmod
    params:
      module: cramfs

  - id: mod_freevxfs
    cis_id: "1.1.1.2"
    title: "Ensure freevxfs kernel module is not available"
    level: 1
    profile: server
    category: filesystem
    type: kmod
    params:
      module: freevxfs

  - id: mod_hfs
    cis_id: "1.1.1.3"
    title: "Ensure hfs kernel module is not available"
    level: 1
    profile: server
    category: filesystem
    type: kmod
    params:
      module: hfs

  - id: mod_hfsplus
    cis_id: "1.1.1.4"
    title: "Ensure hfsplus kernel module is not available"
    level: 1
    profile: server
    category: filesystem
    type: kmod
    params:
      module: hfsplus

  - id: mod_jffs2
    cis_id: "1.1.1.5"
    title: "Ensure jffs2 kernel module is not available"
    level: 1
    profile: server
    category: filesystem
    type: kmod
    params:
      module: jffs2

  - id: mod_udf
    cis_id: "1.1.1.6"
    title: "Ensure udf kernel module is not available"
    level: 1
    profile: server
    category: filesystem
    type: kmod
    params:
      module: udf

  - id: mod_usb_storage
    cis_id: "1.1.1.7"
    title: "Ensure usb-storage kernel module is not available"
    level: 2
    profile: server
    category: filesystem
    type: kmod
    params:
      module: usb-storage