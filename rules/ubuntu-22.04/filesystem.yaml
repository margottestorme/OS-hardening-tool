# =============================================================================
# Règles CIS — modules noyau filesystem (section 1.1.1.x)
# Benchmark : CIS Ubuntu Linux 22.04 LTS v3.0.0 — profil Server
# =============================================================================
# VÉRIFIÉ contre le PDF officiel. Toutes ces règles sont Level 1 - Server.
# Corrections v3.0.0 : udf = 1.1.1.8 (et non 1.1.1.6), usb-storage = 1.1.1.9
# (et non 1.1.1.7) et usb-storage est Level 1 - Server (vérifié p.47).
# squashfs (1.1.1.7) EXCLU : utilisé par snapd, le désactiver casse les snaps.
# =============================================================================

rules:
  - id: mod_cramfs
    cis_id: "1.1.1.1"
    title: "Ensure cramfs kernel module is not available"
    level: 1
    profile: server
    category: filesystem
    type: kmod
    params:
      module: cramfs

